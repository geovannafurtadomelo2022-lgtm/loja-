<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Femme Boutique - Criar conta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="cadastro-card">

            <!-- Logo -->
            <div class="logo">
                <div class="flor">❀</div>
                <h1>La Femme</h1>
                <span>B O U T I Q U E</span>
            </div>

            <!-- Título -->
            <section class="titulo">
                <h2>Criar conta</h2>
                <p>Preencha seus dados para se cadastrar</p>
            </section>

            <!-- Formulário -->
            <form id="formCadastro">

                <!-- Nome -->
                <div class="input-box">
                    <span class="icon">♙</span>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome completo"
                    >
                </div>

                <!-- E-mail -->
                <div class="input-box">
                    <span class="icon">✉</span>
                    <input
                        type="email"
                        id="email"
                        placeholder="E-mail"
                    >
                </div>

                <!-- Senha -->
                <div class="input-box">
                    <span class="icon">♙</span>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Senha"
                    >
                </div>

                <!-- Telefone -->
                <div class="input-box">
                    <span class="icon">⌕</span>
                    <input
                        type="tel"
                        id="telefone"
                        placeholder="Telefone (opcional)"
                    >
                </div>

                <!-- Mensagem de erro -->
                <div id="mensagem"></div>

                <!-- Botão -->
                <button type="submit" class="btn-cadastrar">
                    Cadastrar
                </button>

            </form>

            <!-- Divisor -->
            <div class="ou">
                <span></span>
                <p>ou cadastre-se com</p>
                <span></span>
            </div>

            <!-- Redes sociais -->
            <div class="social-login">

                <button class="social google">
                    <b>G</b>
                </button>

                <button class="social facebook">
                    <b>f</b>
                </button>

                <button class="social apple">
                    <b></b>
                </button>

            </div>

            <!-- Login -->
            <div class="login">
                Já tem uma conta?
                <a href="#">Entrar</a>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
